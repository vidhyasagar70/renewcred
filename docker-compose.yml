# ─────────────────────────────────────────────────────────────────────────────
# CMS Monorepo — Docker Compose (Development)
# Runs: MongoDB | Backend (Node/Express/TS) | Frontend (Next.js)
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cms_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: cms_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cms_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development           # Use the dev stage (hot reload)
    container_name: cms_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/cms_db
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: http://localhost:3000
    volumes:
      # Mount source for hot-reload; exclude node_modules with anonymous volume
      - ./backend/src:/app/src
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development           # Use the dev stage (hot reload)
    container_name: cms_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      WATCHPACK_POLLING: 'true'     # Required for hot-reload in Docker on Windows/macOS
    volumes:
      # Mount source for hot-reload; exclude node_modules and .next with anonymous volumes
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cms_network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cms_network:
    driver: bridge
